<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discover JavaScript functions. Explore their inputs, outputs, and HTTP APIs in one place."
    />
    <title>Function explorer · jsfn.run</title>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <a class="skip-link" href="#detail">Skip to documentation</a>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">ƒ</span>jsfn<span class="brand-suffix">.run</span></a>
      <span class="topbar-label">Function explorer</span>
      <a class="source-link" href="https://github.com/jsfn-run/functions" target="_blank" rel="noreferrer"
        >View source ↗</a
      >
    </header>
    <main class="workspace">
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">SMALL FUNCTIONS. ENDLESS POSSIBILITIES.</p>
          <h1 id="page-title">Your next building block.</h1>
          <p class="intro-copy">Find a function. Understand its inputs. Know what comes back.</p>
        </div>
      </section>
      <div class="explorer">
        <aside class="sidebar" aria-label="Function catalog">
          <div class="sidebar-heading">
            <h2>Functions <span id="count" class="count">40</span></h2>
          </div>
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><input id="search" type="search" placeholder="Search functions…" aria-label="Search functions" /><kbd
              >/</kbd
            ></label
          >
          <p id="list-status" class="list-status" role="status"></p>
          <nav id="function-list" aria-label="Available functions"></nav>
          <div class="sidebar-note">
            <span class="note-symbol">{ }</span>
            <div>
              <strong>One API. Many possibilities.</strong>
            </div>
          </div>
        </aside>
        <article id="detail" class="detail" tabindex="-1" aria-label="Function documentation"></article>
      </div>
      <footer><span>Built for the web. And your terminal.</span></footer>
    </main>
    <div id="notification" class="notification" role="status"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
